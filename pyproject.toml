[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "college-timetable-optimization"
version = "1.0.0"
description = "Reproducible constrained multi-objective engineering college timetabling"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
exact = ["ortools>=9.10,<10"]

[project.scripts]
timetable = "timetable.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
